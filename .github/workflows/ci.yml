name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + type + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Redis service 容器：让限流/验证码相关用例真实执行而不是被 skip
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI 假配置：SECRET_KEY 仅满足 fail-fast 启动校验，不需要真实 API Key
      SECRET_KEY: ci-only-secret-key
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies (locked)
        run: uv sync --all-groups --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy type check
        run: uv run mypy

      # H3 覆盖率闸：fail_under 在 pyproject.toml [tool.coverage.report]，跌破即红
      - name: Pytest (with coverage gate)
        run: uv run pytest -q --cov --cov-report=term-missing

  frontend:
    name: Frontend (lint + format + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies (locked)
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier check
        run: pnpm format:check

      - name: Vitest
        run: pnpm test

      - name: Build (vue-tsc + vite)
        run: pnpm build
