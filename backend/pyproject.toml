[project]
name = "neyria-backend"
version = "0.1.0"
description = "Neyria 后端：FastAPI + SSE 流式对话 + RAG + Agent 工具"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",   # standard = uvloop/httptools，SSE 流式性能依赖 uvloop
    "python-dotenv>=1.0",
    "python-multipart>=0.0.18",  # FastAPI UploadFile 表单解析
    "pydantic[email]>=2.13",     # email extra 提供 EmailStr 校验（替代原直接依赖 email-validator）
    "zhipuai>=2.1",              # 对话模型 glm-4-flash
    "httpx>=0.27",               # SiliconFlow embedding HTTP API
    "langchain-core>=1.5",       # 只用 @tool 装饰器
    "chromadb>=1.5",             # RAG 向量库
    "pypdf>=6.0",                # 文档解析：PDF
    "python-docx>=1.1",          # 文档解析：docx
    "ddgs>=9.0",                 # 联网搜索工具
    "pytz>=2025.2",
    "bcrypt>=4.0.1",             # 直接调用 bcrypt（passlib 已移除：全仓未使用）
    "python-jose[cryptography]>=3.3",
    "aiosmtplib>=3.0",
    "redis>=8.0",
    "langgraph>=1.2.14",
]

# PEP 735 依赖组：uv sync --all-groups 安装；生产部署 uv sync 只装主依赖
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",  # tests/test_ratelimit.py 用 async 测试函数（asyncio_mode=auto）
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.13",
]

[tool.uv]
# 这是应用不是库：不构建/安装项目自身，只管理依赖
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# 把 backend/ 加进 sys.path（前插，同时压过 chromadb 向 site-packages 泄漏的顶层 schemas 包），
# 让测试能 import schemas/core/services（项目非包安装，package=false）
pythonpath = ["."]
asyncio_mode = "auto"  # 原 pytest.ini 内容，已合并到这里

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# 在默认基础上显式选择规则集：E/W 风格、F 逻辑错误、I 导入排序、B 常见 bug、
# UP 现代化语法、SIM 可简化、G 日志用法、DTZ 时区安全、RUF ruff 自有、T20 禁 print（强制走 logging）
select = ["E4", "E7", "E9", "W", "F", "I", "B", "UP", "SIM", "G", "DTZ", "RUF", "T20"]
# BLE001（禁 except Exception）不启用：本项目约定是“允许宽捕获但必须记日志或注释说明”（见 solved.md #25）；
# RUF001/002/003 是中文全角标点误报（注释/文档字符串大量中文），对本项目无意义
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# 测试里的 print 是合理的调试/压测输出（pytest -s 可见），不强制走 logging
"tests/**" = ["T20"]
# 一次性分析脚本用 print 输出进度是设计行为；开头必须 sys.path 调整路径再导业务模块
"scripts/**" = ["T20", "E402"]
# QA 驱动脚本是手动起停的人工验收仪：进程级生命周期（Popen 文件句柄活到底）+ 紧凑布尔
# 断言写法是其特性，不是 oid。按类精准豁免，业务代码不受益。
"scripts/qa/**" = ["T20", "E402", "E701", "E702", "SIM105", "SIM115"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入惯用法：默认参数里调用 Depends()/Query()/File() 是框架设计，不是 B008 要抓的 bug
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Header", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
# 按 todo §4.2：先覆盖 core/schemas/services.rag，不第一天追求全仓零错误
files = ["core", "schemas", "services/rag", "services/chat"]
# 项目非包安装且各目录无 __init__.py（命名空间包）：显式告诉 mypy 以 backend/ 为包根，
# 否则 core/config.py 会被同时解析成 config 和 core.config 两个模块名而报错
explicit_package_bases = true
mypy_path = "."
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# 第三方库无 stubs 的不报 import 错误（逐步收紧）
ignore_missing_imports = true
